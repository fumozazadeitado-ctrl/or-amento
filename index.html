<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:dark;
  --navy:#0A1322;--navy2:#1C2940;--navy3:#26344B;
  --lar:#2563EB;--lar2:#3B82F6;--larh:#60A5FA;--ama:#38BDF8;
  --verde:#22C55E;--zap:#25D366;--verm:#DC2626;
  --bg:#0F1A2B;--card:#1C2940;--inp:#14213A;--tit:#F8FAFC;--txt:#E5E9F0;--txt2:#A8B3C4;--txt3:#7C8AA0;--borda:#2E3D57;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));position:relative}
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.top h1{font-size:17px;font-weight:800;flex:1;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-size:11.5px;font-weight:600;color:#9AA5B3;letter-spacing:.3px}
.brand{font-weight:900;letter-spacing:.5px}.brand b{color:var(--ama)}
.top .ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex-shrink:0}
.top .ib svg{width:20px;height:20px;stroke:#fff}
.wrap{padding:14px 14px 0}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--borda)}
.card h3{font-size:13px;font-weight:800;color:var(--tit);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-size:13px;color:var(--larh);text-transform:none;letter-spacing:0}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--txt2);margin:0 0 5px}
.in{width:100%;border:1.5px solid var(--borda);border-radius:11px;padding:11px 12px;background:var(--inp);outline:none;transition:border-color .15s}
.in:focus{border-color:var(--lar)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.f{margin-bottom:12px}
.hint{font-size:12px;color:var(--txt3);margin-top:5px;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:12px;font-weight:800;font-size:15px;background:linear-gradient(135deg,var(--lar),var(--lar2));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--navy3);box-shadow:none}
.btn.zap{background:var(--zap);box-shadow:0 6px 16px rgba(37,211,102,.3)}
.btn.lite{background:var(--card);color:var(--tit);border:1.5px solid var(--borda);box-shadow:none}
.btn.red{background:var(--card);color:#F87171;border:1.5px solid rgba(220,38,38,.45);box-shadow:none}
.btn svg{width:19px;height:19px;stroke:currentColor}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:10px}
.lnk{color:var(--larh);font-weight:700;font-size:14px;padding:8px 0;display:inline-flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--bg);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;color:var(--txt2)}
.seg button.on{background:var(--lar);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(37,99,235,.15);color:var(--larh);border:1px solid rgba(59,130,246,.35);font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:20px}
.chip.g{background:var(--bg);color:var(--txt2);border-color:var(--borda)}
.chip.on{background:var(--lar);color:#fff;border-color:var(--lar)}
.muted{color:var(--txt2)}
/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid var(--borda);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .in2{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;height:66px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--txt3);padding:8px 0 10px}
.nav button svg{width:23px;height:23px;stroke:currentColor}
.nav button.on{color:var(--larh)}
.nav .plus{position:relative;top:-14px}
.nav .plus span{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--lar),var(--lar2));display:grid;place-items:center;box-shadow:0 8px 20px rgba(37,99,235,.45);border:4px solid var(--navy)}
.nav .plus span svg{stroke:#fff;width:26px;height:26px}
/* HOME */
.hero{background:var(--navy);color:#fff;padding:4px 16px 22px;border-radius:0 0 24px 24px}
.hero p{color:#CBD5E1;font-size:14px;margin-bottom:14px}
.bigmic{display:flex;align-items:center;gap:14px;width:100%;background:linear-gradient(135deg,var(--lar),var(--lar2));border-radius:18px;padding:16px;color:#fff;text-align:left;box-shadow:0 10px 26px rgba(37,99,235,.4)}
.bigmic .c{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;flex-shrink:0}
.bigmic .c svg{width:26px;height:26px;stroke:#fff}
.bigmic b{display:block;font-size:17px;font-weight:800}
.bigmic small{font-size:12.5px;opacity:.9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:13px;border:1px solid var(--borda)}
.stat small{font-size:11.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.stat b{display:block;font-size:20px;font-weight:800;color:var(--tit);margin-top:3px}
.stat b.g{color:var(--verde)}
.cfgline{display:flex;gap:8px;margin-top:12px}
.cfgline button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;text-align:left;color:#fff}
.cfgline small{display:block;font-size:11px;color:#9AA5B3;font-weight:700}
.cfgline b{font-size:16px;color:var(--ama)}
/* LISTA */
.oc{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:13px;margin-bottom:9px;border:1px solid var(--borda);width:100%;text-align:left}
.oc .n{width:46px;height:46px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--tit);flex-shrink:0}
.oc .m{flex:1;min-width:0}
.oc .m b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .m small{display:block;font-size:12.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .v{text-align:right;flex-shrink:0}
.oc .v b{display:block;font-size:14.5px;color:var(--tit)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.st-rascunho{background:rgba(148,163,184,.16);color:#CBD5E1}.st-enviado{background:rgba(59,130,246,.2);color:#93C5FD}.st-aprovado{background:rgba(34,197,94,.16);color:#86EFAC}.st-recusado{background:rgba(239,68,68,.16);color:#FCA5A5}.st-pago{background:rgba(234,179,8,.16);color:#FDE047}
.empty{text-align:center;padding:40px 20px;color:var(--txt2)}
.empty .e{font-size:42px;margin-bottom:8px}
/* EDITOR */
.voice{background:var(--navy);border:1px solid var(--borda);border-radius:16px;padding:14px;margin-bottom:12px;color:#fff}
.voice .vr{display:flex;gap:10px;align-items:stretch}
.mic{width:60px;border-radius:14px;background:linear-gradient(135deg,var(--lar),var(--lar2));display:grid;place-items:center;flex-shrink:0;min-height:60px}
.mic svg{width:28px;height:28px;stroke:#fff}
.mic.rec{animation:pulse 1.2s infinite;background:var(--verm)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}70%{box-shadow:0 0 0 14px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
.voice textarea{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:10px;min-height:60px;resize:none;font-size:15px;outline:none}
.voice textarea::placeholder{color:#9AA5B3}
.voice .vh{font-size:12px;color:#9AA5B3;margin-top:8px;line-height:1.45}
.voice .vb{margin-top:10px}
.item{border:1.5px solid var(--borda);border-radius:13px;padding:11px;margin-bottom:9px}
.item .ih{display:flex;gap:8px;align-items:flex-start}
.item .ih .in{padding:9px 10px;font-weight:600;font-size:15px}
.x{width:36px;height:36px;border-radius:10px;background:rgba(220,38,38,.15);color:#F87171;display:grid;place-items:center;flex-shrink:0}
.x svg{width:17px;height:17px;stroke:currentColor}
.ig{display:grid;gap:7px;margin-top:8px;align-items:end}
.ig.s{grid-template-columns:72px 1fr 1fr}
.ig.p{grid-template-columns:58px 1fr 78px}
.pout{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px dashed var(--borda);font-size:12.5px;font-weight:700;color:var(--txt3);text-transform:uppercase}

/* ---------- CÁLCULOS ---------- */
const horaSugerida = (c, s, h) => h > 0 ? Math.ceil(((num(c) + num(s)) / num(h)) / 5) * 5 : 0;
const vendaPeca = p => r2(num(p.qtd) * num(p.custo) * (1 + num(p.margem) / 100));
const valorServ = (o, s) => s.fixo != null && s.fixo !== '' ? r2(num(s.fixo) * num(s.qtd || 1)) : r2(num(s.horas) * num(s.qtd || 1) * num(o.valorHora));
function totais(o) {
  const mo = r2(o.servicos.reduce((a, s) => a + valorServ(o, s), 0));
  const pc = r2(o.pecas.reduce((a, p) => a + vendaPeca(p), 0));
  const margemPecas = r2(o.pecas.reduce((a, p) => a + num(p.qtd) * num(p.custo) * num(p.margem) / 100, 0));
  const ex = r2(o.extras.reduce((a, e) => a + num(e.valor), 0));
  const sub = r2(mo + pc + ex);
  const desc = o.desconto.tipo === '%' ? r2(sub * num(o.desconto.valor) / 100) : r2(num(o.desconto.valor));
  const total = r2(Math.max(0, sub - desc));
  const horas = r2(o.servicos.reduce((a, s) => a + (s.fixo != null && s.fixo !== '' ? 0 : num(s.horas) * num(s.qtd || 1)), 0));
  return {mo, pc, ex, sub, desc, total, horas, ganho: r2(mo + margemPecas - desc)};
}

/* ---------- LEITOR DE VOZ / TEXTO ---------- */
const NUMW = {um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, doze: 12};
const MARCAS = [
  {m: 'Scania', k: ['scania'], cat: 'pesado'}, {m: 'Volvo', k: ['volvo'], cat: 'pesado'},
  {m: 'Mercedes-Benz', k: ['mercedes', 'benz', 'mb'], cat: null}, {m: 'Volkswagen', k: ['volkswagen', 'volks', 'vw', 'wolks'], cat: null},
  {m: 'Ford', k: ['ford'], cat: null}, {m: 'Iveco', k: ['iveco'], cat: null}, {m: 'DAF', k: ['daf'], cat: 'pesado'},
  {m: 'MAN', k: ['man'], cat: 'pesado'}, {m: 'International', k: ['international'], cat: 'pesado'},
  {m: 'Hyundai', k: ['hyundai'], cat: 'leve'}, {m: 'Agrale', k: ['agrale'], cat: 'leve'}, {m: 'JAC', k: ['jac'], cat: 'leve'},
  {m: 'Foton', k: ['foton'], cat: 'leve'}, {m: 'Sinotruk', k: ['sinotruk'], cat: 'pesado'}, {m: 'Shacman', k: ['shacman'], cat: 'pesado'}
];
const MODCAT = [
  [/\b(fh|fm|fmx|nh|actros|axor|stralis|hi ?way|s ?way|xf|cf|tgx|tgs|9800|meteor|constellation|r ?\d{3}|g ?\d{3}|p ?\d{3}|s ?\d{3})\b/, 'pesado'],
  [/\b(vm|atego|worker|tector|cargo|vertis)\b/, 'medio'],
  [/\b(delivery|accelo|daily|hr|express|f ?4000|f ?350|3 ?4|tres quartos|vuc)\b/, 'leve'],
  [/\b(cavalo|carreta|bitrem|rodotrem|bitruck|traçado|tracado|truck)\b/, 'pesado'], [/\btoco\b/, 'medio']
];
function catPorPeso(t) { const m = t.match(/\b(\d{1,2})[ -]?(\d{2,3})\b/) || t.match(/\b(\d{3,4})\b/); if (!m) return null; let ton; if (m[2]) ton = +m[1]; else { const n = m[1]; ton = n.length === 4 ? +n.slice(0, 2) : +n.slice(0, 1); } if (!ton) return null; return ton <= 10 ? 'leve' : ton <= 17 ? 'medio' : 'pesado'; }
function lerNumero(tk, i) {
  let v = null, j = i;
  if (/^\d+(\.\d+)?$/.test(tk[j])) { v = parseFloat(tk[j]); j++; }
  else if (NUMW[tk[j]] != null) { v = NUMW[tk[j]]; j++; }
  else if (tk[j] === 'mil') return {v: 1000, end: j + 1};
  else return null;
  if (tk[j] === 'mil') { v *= 1000; j++; if (tk[j] === 'e' && /^\d+$/.test(tk[j + 1] || '') && +tk[j + 1] < 1000) { v += +tk[j + 1]; j += 2; } }
  if (tk[j] === 'reais' || tk[j] === 'real') j++;
  return {v, end: j};
}
function acharFrase(tk, ph) {
  // devolve a menor janela de tokens que contém todas as palavras da frase
  const pos = ph.map(w => tk.map((t, i) => t.startsWith(w) ? i : -1).filter(i => i >= 0));
  if (pos.some(p => !p.length)) return null;
  let best = null;
  pos[0].forEach(st => {
    const used = [st]; let ok = true;
    for (let k = 1; k < pos.length; k++) { const cand = pos[k].filter(i => !used.includes(i)); if (!cand.length) { ok = false; break; } cand.sort((a, b) => Math.abs(a - st) - Math.abs(b - st) || b - a); used.push(cand[0]); }
    if (!ok) return;
    const lo = Math.min(...used), hi = Math.max(...used);
    const r = {start: lo, end: hi, n: used.length, win: hi - lo + 1, idx: used};
    if (!best || r.start < best.start || (r.start === best.start && (r.n > best.n || (r.n === best.n && r.win < best.win)))) best = r;
  });
  return best;
}
function interpretar(texto) {
  const res = {servicos: [], cliente: '', veiculo: {}};
  let raw = String(texto || '').replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2').replace(/(\d),(\d{1,2})(?!\d)/g, '$1.$2').replace(/r\$\s*/gi, ' ');
  const tAll = norm(raw);
  // veículo
  const tkA = tAll.split(' ');
  for (const mk of MARCAS) {
    const i = tkA.findIndex(t => mk.k.includes(t));
    if (i >= 0) {
      res.veiculo.marca = mk.m;
      const mod = [];
      for (let j = i + 1; j < Math.min(i + 4, tkA.length); j++) {
        const t = tkA[j];
        if (STOP.has(t) || /^(placa|cliente|km|kit|com|troca|trocar|revisao|motor|cavalo|caminhao)$/.test(t)) break;
        if (/^[a-z]{1,10}$/.test(t) && mod.length && /\d/.test(mod[mod.length - 1])) break;
        mod.push(t);
        if (mod.length >= 2 && /\d/.test(t)) break;
      }
      if (mod.length) res.veiculo.modelo = mod.join(' ').toUpperCase().replace(/^(\D+) (\d)/, '$1 $2');
      const mj = mod.join(' ');
      let cat = null;
      if (MODCAT[0][0].test(mj)) cat = 'pesado';
      else if (MODCAT[2][0].test(mj)) cat = 'leve';
      else if (mk.cat && MODCAT[1][0].test(mj)) cat = 'medio';
      else if (!mk.cat) cat = catPorPeso(mj) || (MODCAT[1][0].test(mj) ? 'medio' : null);
      if (!cat) cat = mk.cat;
      if (cat) res.veiculo.cat = cat;
      break;
    }
  }
  if (!res.veiculo.cat) for (const [rx, c] of MODCAT.slice(3)) if (rx.test(tAll)) { res.veiculo.cat = c; break; }
  const pl = String(texto).toUpperCase().match(/\b([A-Z]{3})[\s-]?(\d[A-Z0-9]\d{2})\b/);
  if (pl) res.veiculo.placa = pl[1] + pl[2];
  const km = tAll.match(/(\d[\d.]*)\s*(mil\s*)?(km|quilometro)/);
  if (km && !/socorro|distancia/.test(tAll)) res.veiculo.km = String(Math.round(parseFloat(km[1]) * (km[2] ? 1000 : 1)));
  const cl = String(texto).toLowerCase().match(/cliente (?:é |e )?([a-zà-ÿ]+)(?: ([a-zà-ÿ]+))?/);
  if (cl) {
    const nomes = [cl[1]];
    const marcaW = MARCAS.flatMap(m => m.k);
    if (cl[2] && !STOP.has(norm(cl[2])) && !marcaW.includes(norm(cl[2])) && !/^(caminhao|carro|veiculo|placa|cavalo|carreta|troca|trocar|revisao)$/.test(norm(cl[2]))) nomes.push(cl[2]);
    res.cliente = nomes.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }
  // segmentos de serviço
  const VERB = '(?:troca|trocar|revis|regul|fazer|faz|instal|limp|diagnost|alinh|balance|consert|repar|remov|tirar|sangr|lubrific|engrax|teste|testar|aferi|calibr|ajust|solda|soldar|socorro)';
  const rawN = raw.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const segs = rawN.split(new RegExp('[;\\n]|,|\\.(?!\\d)|\\s+(?:e|mais|tambem|depois)\\s+(?=' + VERB + ')|\\s+e\\s+(?=(?:do|da|dos|das)\\s)|\\s+(?:mais|tambem)\\s+', 'i')).map(s => s && s.trim()).filter(Boolean);
  let last = null;
  segs.forEach(seg => {
    const tk = norm(seg).split(' ');
    let best = null;
    SERV.forEach(s => s.ph.forEach(ph => {
      const m = acharFrase(tk, ph);
      if (!m) return;
      const c = {s, m};
      if (!best || m.start < best.m.start || (m.start === best.m.start && (m.n > best.m.n || (m.n === best.m.n && m.win < best.m.win)))) best = c;
    }));
    let alvo;
    if (best) { alvo = {sid: best.s.id, qtd: 1, pecas: [], usados: best.m.idx}; res.servicos.push(alvo); last = alvo; }
    else if (last) alvo = last; else return;
    const sv = getServ(alvo.sid);
    // quantidade (por eixo / por roda / por unidade)
    const un = unidadeDe(sv.nome);
    if (un && best) {
      for (let i = 0; i < tk.length - 1; i++) {
        const n = lerNumero(tk, i);
        if (n && n.v > 0 && n.v < 20 && tk[n.end] && (un === 'unidade' || tk[n.end].startsWith(stem(un)) || ph0(sv).some(w => tk[n.end].startsWith(w)))) { alvo.qtd = n.v; break; }
      }
    }
    // peças citadas + preço falado depois da peça
    sv.pecas.forEach(pn => {
      const pw = words(pn).filter(w => w.length > 2).map(stem);
      if (!pw.length) return;
      const m = acharFrase(tk, pw);
      if (!m) return;
      if (alvo.pecas.some(p => p.nome === pn)) return;
      let custo = '';
      for (let j = m.end + 1; j < Math.min(m.end + 5, tk.length); j++) {
        const n = lerNumero(tk, j);
        if (n && n.v >= 5) { custo = n.v; break; }
        if (/^[a-z]+$/.test(tk[j]) && !/^(e|de|a|o|por|custa|custou|paguei|sai|saiu|fica|ficou|reais|real|r)$/.test(tk[j])) break;
      }
      alvo.pecas.push({nome: pn, custo});
    });
  });
  return res;
}
const ph0 = sv => sv.ph[0] || [];

function aplicarTexto(o, texto) {
  const r = interpretar(texto);
  let ns = 0, np = 0;
  if (r.cliente && !o.cliente.nome) o.cliente.nome = r.cliente;
  ['marca', 'modelo', 'placa', 'km'].forEach(k => { if (r.veiculo[k] && !o.veiculo[k]) o.veiculo[k] = r.veiculo[k]; });
  if (r.veiculo.cat) mudarCat(o, r.veiculo.cat);
  r.servicos.forEach(x => {
    addServico(o, x.sid, x.qtd); ns++;
    x.pecas.forEach(p => { if (!o.pecas.some(q => q.nome === p.nome)) { addPeca(o, p.nome, p.custo); np++; } });
  });
  save();
  return {ns, np, r};
}
function mudarCat(o, cat) {

}

      <div class="stat"><small>Orçamentos</small><b>${doMes.length}</b></div>

function cardOrc(o) {
  const t = totais(o);

  const sub = [o.veiculo.marca, o.veiculo.modelo, o.veiculo.placa].filter(Boolean).join(' · ') || (o.servicos[0] ? o.servicos[0].nome : 'Orçamento vazio');

function instalarBanner() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;

function atualizarTotais() {
  const o = cur(); if (!o) return;

/* ---------- SOCORRO ---------- */
let SOC = {km: 40, horasLocal: 1.5, noturno: false, fds: false};
function formSocorro() {
  const c = S.cfg.soc;
  return `<div class="card">
    <div class="row2"><div class="f"><label class="lbl">Distância até o caminhão (km)</label><input class="in" data-soc="km" inputmode="decimal" value="${esc(SOC.km)}"></div>
    <div class="f"><label class="lbl">Horas de serviço no local</label><input class="in" data-soc="horasLocal" inputmode="decimal" value="${esc(SOC.horasLocal)}"></div></div>
    <div class="sw"><span>🌙 Noturno (22h às 5h) <small class="muted">+${fnum(c.noturno)}%</small></span><input type="checkbox" data-soc="noturno" ${SOC.noturno ? 'checked' : ''}></div>
    <div class="sw"><span>📅 Fim de semana / feriado <small class="muted">+${fnum(c.fds)}%</small></span><input type="checkbox" data-soc="fds" ${SOC.fds ? 'checked' : ''}></div>
    <div class="sep"></div>
    <div class="row2"><div class="f"><label class="lbl">Valor por km (R$)</label><input class="in" data-socc="valorKm" inputmode="decimal" value="${esc(c.valorKm)}"></div>
    <div class="f"><label class="lbl">Taxa de saída (R$)</label><input class="in" data-socc="taxaSaida" inputmode="decimal" value="${esc(c.taxaSaida)}"></div></div>
    <div class="row2"><div class="f"><label class="lbl">Adicional noturno %</label><input class="in" data-socc="noturno" inputmode="decimal" value="${esc(c.noturno)}"></div>
    <div class="f"><label class="lbl">Adic. fim de semana %</label><input class="in" data-socc="fds" inputmode="decimal" value="${esc(c.fds)}"></div></div>
    <div class="sw"><span>Cobrar ida e volta</span><input type="checkbox" data-socc="idaVolta" ${c.idaVolta ? 'checked' : ''}></div>
    <div class="sw"><span>Cobrar o tempo de viagem como hora técnica</span><input type="checkbox" data-socc="cobrarViagem" ${c.cobrarViagem ? 'checked' : ''}></div>
    <p class="hint">Como achar o valor por km: preço do diesel ÷ consumo do seu carro de apoio (km/l), mais desgaste (pneu, manutenção) e seu lucro. Ex.: R$ 6,20 ÷ 8 km/l = R$ 0,78 + desgaste ≈ R$ 1,50, e cobrando o dobro pelo risco = R$ 3,00/km.</p>
  </div>`;
}
function socorroCalc() {
  const c = S.cfg.soc, vh = num(S.cfg.valorHora);
  const kmT = num(SOC.km) * (c.idaVolta ? 2 : 1);
  const desloc = r2(kmT * num(c.valorKm));
  const viagemH = c.cobrarViagem ? r2(kmT / (num(c.velMedia) || 60)) : 0;
  const viagem = r2(viagemH * vh);
  const local = r2(num(SOC.horasLocal) * vh);

function buildPDF(pages) {

  const obj = (id, body) => { offs[id] = len; push(`${id} 0 obj\n${body}\nendobj\n`); };

  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ')}] /Count ${n} >>`);
  pages.forEach((p, i) => {
    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
    obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(cid, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    const img = b64(p.jpeg.split(',')[1]);
    offs[iid] = len;
    push(`${iid} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`);
    push(img); push('\nendstream\nendobj\n');
  });
  const total = 3 + n * 3, xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x); push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);

}

function reduzir(file, max, tipo = 'image/jpeg', q = .72) {

}

    case 'ct-enviar': case 'ct-baixar': { toast('Gerando contrato…', 1500); const blob = await pdfContrato(o); const nome = `Contrato-${numFmt(o.num)}.pdf`; if (a === 'ct-baixar') { baixar(blob, nome); toast('Contrato salvo nos downloads.'); } else await compartilhar(blob, nome, `Contrato de serviço — orçamento nº ${numFmt(o.num)}. Por favor, confira e assine.`, o.contrato.cliTel || o.cliente.tel); break; }
    case 'duplicar': { const c = JSON.parse(JSON.stringify(o)); S.seq++; c.id = uid(); c.num = S.seq; c.data = hoje(); c.status = 'rascunho'; S.orcs.unshift(c); save(); ir('editor', c.id); toast('Orçamento duplicado.'); break; }
    case 'excluir': if (confirm('Excluir este orçamento?')) { S.orcs = S.orcs.filter(x => x.id !== o.id); save(); ir('lista'); } break;
    case 'rm-logo': S.cfg.logo = ''; save(); render(); break;
    case 'nc-add': { const nome = $('#ncNome').value.trim(); if (!nome) { toast('Coloque o nome do serviço.'); return; } const h = [num($('#ncL').value), num($('#ncM').value), num($('#ncP').value)]; const id = 'c_' + uid(); S.custom.push({id, cat: 'Meus serviços', nome, h: h.map((v, i) => v || h.find(x => x) || 1), pecas: []}); buildServ(); save(); V.tcat = 'Meus serviços'; render(); toast('Serviço cadastrado.'); break; }
    case 'tmp-reset': if (confirm('Voltar todos os tempos para o padrão?')) { S.over = {}; save(); render(); } break;
    case 'backup': { const blob = new Blob([JSON.stringify(S)], {type: 'application/json'}); baixar(blob, `backup-trucklabs-${new Date().toISOString().slice(0, 10)}.json`); toast('Backup salvo. Guarde no Google Drive ou mande pra você no WhatsApp.', 4000); break; }
    case 'instalar': {
      if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
      modal('Instalar na tela inicial', ios ? `<div class="card"><p style="line-height:1.7">1. Abra este app no <b>Safari</b>.<br>2. Toque no botão <b>Compartilhar</b> (quadrado com seta ⬆️).<br>3. Toque em <b>"Adicionar à Tela de Início"</b>.<br>4. Toque em <b>Adicionar</b>. Pronto! 🎉</p></div>` : `<div class="card"><p style="line-height:1.7">1. Abra este app no <b>Google Chrome</b>.<br>2. Toque nos <b>3 pontinhos ⋮</b> no canto de cima.<br>3. Toque em <b>"Instalar app"</b> ou <b>"Adicionar à tela inicial"</b>.<br>4. Confirme. O ícone aparece junto dos seus apps 🎉</p></div>`
        + `<button class="btn lite" data-act="hide-install">Já instalei / não mostrar mais</button>`);
      break; }
    case 'hide-install': S.cfg.hideInstall = true; save(); fechar(); render(); break;
  }
});
document.addEventListener('click', e => { if (e.target.matches('[data-mod]')) fechar(); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });

/* ---------- INÍCIO ---------- */
(async () => {
  await load();
  buildServ();
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
